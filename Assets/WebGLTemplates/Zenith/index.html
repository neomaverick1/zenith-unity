<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07081c" />
    <meta name="description" content="Zenith: a 2048 merge puzzle where every tile is a star, with a soundtrack that grows as you play. Built in Unity." />
    <title>Zenith</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07081c;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #07081c;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 22px;
        background: radial-gradient(120% 80% at 50% 0%, #1b1f5a 0%, #0b0d2a 55%, #05060f 100%);
        color: #dceeff;
        font: 600 14px system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.06em;
        transition: opacity 0.6s ease;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading svg {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 0 18px rgba(170, 220, 255, 0.9));
        animation: twinkle 3.2s ease-in-out infinite;
      }
      @keyframes twinkle {
        50% {
          transform: scale(0.86) rotate(45deg);
        }
      }
      #bar {
        width: 180px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #ff9d4a, #ffcf6e);
        transition: width 0.2s ease;
      }
      #note {
        color: rgba(226, 230, 255, 0.5);
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <radialGradient id="c" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" /><stop offset=".45" stop-color="#d9eeff" /><stop offset="1" stop-color="#7cbcff" stop-opacity="0" /></radialGradient>
          <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" /><stop offset="1" stop-color="#9fd3ff" /></linearGradient>
        </defs>
        <circle cx="32" cy="32" r="22" fill="url(#c)" opacity=".6" />
        <path d="M32 2 C34 22 42 30 62 32 C42 34 34 42 32 62 C30 42 22 34 2 32 C22 30 30 22 32 2 Z" fill="url(#r)" />
      </svg>
      <div>ZENITH</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="note">Loading the universe</div>
    </div>
    <script>
      // the game draws at the screen's real sharpness, capped so phones stay smooth
      window.zenithDpr = Math.min(window.devicePixelRatio || 1, 2.5);
      var canvas = document.querySelector('#unity-canvas');
      var fill = document.querySelector('#fill');
      var loading = document.querySelector('#loading');
      var script = document.createElement('script');
      script.src = 'Build/{{{ LOADER_FILENAME }}}';
      script.onload = function () {
        createUnityInstance(
          canvas,
          {
            arguments: [],
            dataUrl: 'Build/{{{ DATA_FILENAME }}}',
            frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
            workerUrl: 'Build/{{{ WORKER_FILENAME }}}',
#endif
#if USE_WASM
            codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if MEMORY_FILENAME
            memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
            streamingAssetsUrl: 'StreamingAssets',
            companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
            productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
            productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
            matchWebGLToCanvasSize: true,
            devicePixelRatio: window.zenithDpr,
          },
          function (p) {
            fill.style.width = Math.round(p * 100) + '%';
          },
        )
          .then(function () {
            loading.classList.add('done');
            setTimeout(function () {
              loading.remove();
            }, 700);
          })
          .catch(function (e) {
            document.querySelector('#note').textContent = 'This browser could not start the game: ' + e;
          });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
